name: publish
# Releases are published locally: `pnpm run release:publish` (scripts/publish-release.mjs)
# after `pnpm run ci:release` passes. That keeps the Windows .exe build on the machine
# that already verified it, so no GitHub runner is needed for routine work.
# This workflow is a manual fallback for environments without a local toolchain.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package and publish (for example v0.0.1)
        required: true
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          test "${{ inputs.tag }}" = "v$version"
      - run: node scripts/build-web.mjs
      - run: node scripts/build-desktop.mjs --skip-smoke
      - run: node scripts/prepare-release.mjs artifacts/release --require-desktop
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs artifacts/release --allow-prerelease
      - name: Publish to npm (optional when NPM_TOKEN is configured)
        shell: bash
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured; skipping npm publish."
            exit 0
          fi
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          npm publish --access public --provenance --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
