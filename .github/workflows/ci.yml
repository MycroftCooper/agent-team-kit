name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-boundaries.mjs
      - run: node scripts/test.mjs
      - run: node scripts/build-web.mjs
      - run: node scripts/e2e.mjs
      - run: node scripts/smoke.mjs
      - run: node scripts/benchmark.mjs --duration 30000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: |
            artifacts/e2e/*.png
            artifacts/e2e/report.json
            artifacts/benchmark/report.json
            artifacts/smoke/report.json
