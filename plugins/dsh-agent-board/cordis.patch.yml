# __PLUGIN_PACKAGE__ DSH bundle patch.
# This file is generated by `atk plugin sync` for the consuming project.
#
# IMPORTANT: the bundle layer is a patch list, so a new row MUST use `insert:`.
# Writing `id` + `name` directly is treated as an override of a row that does not
# exist yet: DSH reports `patch: entry "__PLUGIN_ID__" not found` and silently
# skips the plugin - which is why it does not appear in the sidebar.
- insert:
    - id: __PLUGIN_ID__
      name: __PLUGIN_PACKAGE__
      config:
        workspace: __PROJECT_WORKSPACE__
        flowDir: __PROJECT_FLOW_DIR__
        artifactDir: __PROJECT_ARTIFACT_DIR__
        language: __PROJECT_LANGUAGE__
